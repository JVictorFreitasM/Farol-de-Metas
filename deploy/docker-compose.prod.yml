services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - farol_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - farol_net
    # Sem "ports": não fica acessível fora da rede da stack.

  backend:
    image: farol-backend:prod
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - farol_net
    # Sem "ports": o backend só é acessível pelo frontend/nginx, dentro da rede.

  frontend:
    image: farol-frontend:prod
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5174:80"
    networks:
      - farol_net
    # Único serviço com porta publicada: é o ponto único de entrada do sistema.

networks:
  farol_net:
    driver: bridge

volumes:
  farol_db_data:
